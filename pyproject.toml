[project]
name = "runeascend"
version = "1.1.0"
description = "Runescape Trading Platform"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Charles Warren", email = "ciwarren@mtu.edu" }]
dependencies = [
    "pandas>=2.0.3,<3.0.0",
    "clickhouse-driver>=0.2.6,<0.3.0",
    "pyyaml>=6.0.1,<7.0.0",
    "discord>=2.3.2,<3.0.0",
    "twisted>=26.4.0,<27.0.0",
    # aiokafka 0.14 (via faust-streaming) calls request.prepare() on
    # kafka-python Request objects. That API was removed in kafka-python
    # 2.0.3+; pin to 2.0.2 exactly until aiokafka/faust catches up.
    "kafka-python==2.0.2",
    # aiokafka 0.12+ shipped incompatible changes that break faust's
    # protocol handling. Pin to 0.11 (matches what faust-streaming used
    # to install transitively) until faust is updated.
    "aiokafka>=0.11.0,<0.12.0",
    "structlog>=24.2.0,<25.0.0",
    "requests>=2.33.0,<3.0.0",
    "faust-streaming>=0.11.1,<0.12.0",
]

[project.scripts]
# RuneServant
trade_seeker = "runeascend.runeservant.seeker:main"
discord_bot = "runeascend.runeservant.bot:main"

# RuneSpreader
publisher = "runeascend.runespreader.publisher:main"
archiver = "runeascend.runespreader.archiver:main"

# RuneVault
consumer = "runeascend.runevault.consumer:main"
vault = "runeascend.runevault.vault:main"

[dependency-groups]
dev = [
    "deptry>=0.16.1,<0.17.0",
    "black>=26.3.1,<27.0.0",
    "isort>=5.13.2,<6.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.21.1,<0.22.0",
    "testcontainers>=4.7.2,<5.0.0",
    "clickhouse-migrations>=0.7.1,<0.8.0",
    "anyio>=4.4.0,<5.0.0",
    "trio>=0.26.2,<0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runeascend"]

[tool.hatch.build.targets.sdist]
include = ["runeascend", "tests", "README.md"]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80

[tool.deptry]
ignore = ["DEP003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
